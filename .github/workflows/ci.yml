name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both desktop backends are supported, so both are tested: the kdotool /
        # ydotool / AT-SPI one under Linux, and the Win32 / UI Automation one
        # under Windows.
        os: [ubuntu-latest, windows-latest]

    # No Xvfb, fake D-Bus, dummy kdotool/ydotool or visible desktop needed: every
    # test that would touch the real one is skipped, and tests/conftest.py empties
    # PATH and stubs the desktop so a forgotten mock fails loudly instead of
    # driving the machine. The variables below make sure nothing leaks in from the
    # runner.
    env:
      DISPLAY: ""
      WAYLAND_DISPLAY: ""
      DBUS_SESSION_BUS_ADDRESS: ""
      CONTROL_JSON: ""
      CONTROL_SESSION_ID: ""
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (incl. dev group)
        # --locked: fail if uv.lock is out of date with pyproject.toml.
        # Playwright's Python package is installed, but no browser binaries:
        # the tests never launch Chromium. comtypes comes in on Windows only, and
        # the UIA tests skip themselves if UI Automation is unreachable.
        run: uv sync --locked

      - name: Smoke-test the CLI entry point
        # The console script lands in .venv/bin on POSIX and .venv\Scripts here.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            .venv/Scripts/control.exe --help > /dev/null
          else
            .venv/bin/control --help > /dev/null
          fi

      - name: Run test suite
        shell: bash
        run: .venv/bin/python -m pytest -v || .venv/Scripts/python.exe -m pytest -v
