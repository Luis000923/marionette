[project]
name = "marionette"
version = "0.1.0"
description = "Full desktop control for Windows and KDE Plasma: windows, input, screenshots, apps, and browser automation."
authors = [
    { name = "Luis000923", email = "cruncron@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.47",
    # UI Automation (control a11y) is COM, and comtypes is the one pure-Python
    # bridge that needs no compiled wheel. Windows-only: on Linux the same CLI
    # is answered by AT-SPI, which needs no Python dependency at all.
    "comtypes>=1.2 ; sys_platform == 'win32'",
]

[project.scripts]
control = "control.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.build-backend]
module-name = "control"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Strict: a typo'd marker or a bad ini key is an error, and an xfail that
# unexpectedly passes fails the run instead of being silently reported.
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
